<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>basemap compare</title>
<style>
  :root { --bg:#0e1116; --panel:#161b23; --edge:#2a3140; --fg:#d7dde8;
          --dim:#8b93a7; --acc:#ffb347; --sel:#ff5d3a; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg);
         font:13px/1.45 "Source Sans 3",system-ui,sans-serif; height:100vh;
         display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; gap:10px; align-items:center; padding:8px 12px;
           border-bottom:1px solid var(--edge); flex-wrap:wrap; }
  header h1 { font-size:15px; font-weight:600; margin-right:6px; }
  header .hint { color:var(--dim); font-size:12px; }
  select,input[type=text] { background:var(--panel); color:var(--fg);
    border:1px solid var(--edge); border-radius:6px; padding:5px 8px;
    font:inherit; }
  #main { flex:1; display:flex; min-height:0; }
  .mapcol { flex:1; display:flex; flex-direction:column; min-width:0;
            border-right:1px solid var(--edge); }
  .mapbar { display:flex; gap:8px; align-items:center; padding:6px 10px;
            border-bottom:1px solid var(--edge); background:var(--panel); }
  .combo { position:relative; flex:1; min-width:0; }
  .combo input { width:100%; }
  .combo .list { position:absolute; z-index:30; left:0; right:0; top:100%;
    max-height:340px; overflow:auto; background:var(--panel);
    border:1px solid var(--edge); border-radius:0 0 8px 8px; display:none; }
  .combo .list div { padding:5px 9px; cursor:pointer; display:flex; gap:8px;
    white-space:nowrap; overflow:hidden; }
  .combo .list div:hover, .combo .list div.hot { background:#232b38; }
  .combo .list .ffr { color:var(--acc); min-width:52px; }
  .combo .list .dt { color:var(--dim); margin-left:auto; }
  .combo .list .up { color:#7fd0ff; }
  .meta { font-size:12px; color:var(--dim); padding:2px 10px 4px;
          background:var(--panel); border-bottom:1px solid var(--edge);
          white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta b { color:var(--acc); font-weight:600; }
  .stage { position:relative; flex:1; min-height:0; }
  .stage canvas { position:absolute; inset:0; width:100%; height:100%; }
  .stage .ov { cursor:crosshair; }
  #tablecol { width:400px; display:flex; flex-direction:column;
              min-width:280px; }
  #tablehead { padding:7px 10px; border-bottom:1px solid var(--edge);
               background:var(--panel); display:flex; gap:8px;
               align-items:center; }
  #tablehead .n { color:var(--acc); font-weight:600; }
  #tablehead button { background:none; border:1px solid var(--edge);
    color:var(--dim); border-radius:6px; padding:2px 8px; cursor:pointer; }
  #tbody { flex:1; overflow-y:auto; position:relative; }
  #tspacer { position:absolute; width:1px; }
  .trow { position:absolute; left:0; right:0; padding:6px 10px;
    border-bottom:1px solid #1c222d; overflow:hidden; display:flex; gap:8px; }
  .trow .idx { color:var(--dim); font-size:11px; min-width:64px; }
  .trow .txt { flex:1; display:-webkit-box; -webkit-line-clamp:3;
    -webkit-box-orient:vertical; overflow:hidden; font-size:12px; }
  .trow img { height:72px; border-radius:4px; background:#000; }
  .slider { display:flex; align-items:center; gap:5px; color:var(--dim);
            font-size:12px; }
  #swap { background:var(--panel); border:1px solid var(--edge);
    color:var(--fg); border-radius:6px; padding:4px 10px; cursor:pointer; }
  #swap:hover { border-color:var(--acc); }
  #brushsvg .selection { stroke:#e8edf5; fill:#fff; fill-opacity:.18; }
  #brushsvg .handle { fill:#e8edf5; }
</style></head><body>
<header>
  <h1>basemap compare</h1>
  <label>rung <select id="rung"></select></label>
  <button id="swap" title="swap A and B">A &#8646; B</button>
  <label>pick <select id="pick">
    <option value="circle">circle</option>
    <option value="tile">tile</option>
  </select></label>
  <input type="range" id="pickr" min="8" max="90" value="28"
    style="width:70px" title="circle radius">
  <button id="clearsel2" style="background:var(--panel);
    border:1px solid var(--edge); color:var(--fg); border-radius:6px;
    padding:4px 10px; cursor:pointer">clear sel</button>
  <span class="slider">heat <input type="range" id="gain" min="-2" max="4"
        step="0.1" value="0.6" style="width:90px"></span>
  <label>view <select id="view">
    <option value="heat">heatmap</option>
    <option value="spread">spread vs other</option>
  </select></label>
  <span id="legend" style="display:none; align-items:center; gap:6px">
    <span class="hint">compacted</span>
    <svg id="brushsvg" width="210" height="26"></svg>
    <span class="hint">spread</span>
    <span id="frange" class="hint" style="min-width:80px"></span>
    <span id="fcount" style="color:var(--acc); min-width:90px"></span>
  </span>
  <span id="spreadinfo" class="hint" style="color:var(--acc)"></span>
  <span class="hint">hover highlights on the other map; click to select +
    list &middot; drag pan &middot; wheel zoom &middot; dbl-click resets view
    + clears selection</span>
</header>
<div id="main">
  <div class="mapcol" id="colA"></div>
  <div class="mapcol" id="colB"></div>
  <div id="tablecol">
    <div id="tablehead"><span class="n" id="selcount">0</span>
      <span id="selwhere" class="hint">no tile selected</span>
      <button id="clearsel">clear</button></div>
    <div id="tbody"><div id="tspacer"></div></div>
  </div>
</div>
<script src="d3.v7.min.js"></script>
<script>
"use strict";
const API = location.origin.replace(":8800", ":8801");
const TILE = 30;               // screen px tile for click-selection
let catalog = null, rungs = [], state = {
  rung: null, sel: { ids: null, from: null, shape: null }, gain: 0.6,
  view: "heat", pick: "circle", pickR: 28,
};

// float16 -> float32 lookup (spread bins are f16)
const F16 = (() => {
  const t = new Float32Array(65536), b = new ArrayBuffer(4),
        u = new Uint32Array(b), f = new Float32Array(b);
  for (let h = 0; h < 65536; h++) {
    const s = (h & 0x8000) << 16, e = (h & 0x7c00) >> 10, m = h & 0x3ff;
    if (e === 0) u[0] = s | 0;                       // subnormals ~ 0
    else if (e === 31) u[0] = s | 0x7f800000 | (m << 13);
    else u[0] = s | ((e + 112) << 23) | (m << 13);
    t[h] = f[0];
  }
  return t;
})();

/* ---------------- map panel ---------------- */
function makePanel(colId, key) {
  const col = document.getElementById(colId);
  col.innerHTML = `
    <div class="mapbar"><b style="color:var(--acc)">${key}</b>
      <div class="combo"><input type="text" spellcheck="false"
        placeholder="type to filter maps (recent first)&hellip;">
        <div class="list"></div></div></div>
    <div class="meta"></div>
    <div class="stage"><canvas class="gl"></canvas>
      <canvas class="ov"></canvas></div>`;
  const p = {
    key, col, entry: null, coords: null, n: 0,
    input: col.querySelector("input"), list: col.querySelector(".list"),
    meta: col.querySelector(".meta"),
    stage: col.querySelector(".stage"),
    glc: col.querySelector(".gl"), ovc: col.querySelector(".ov"),
    view: { z: 0.92, tx: 0, ty: 0 },
    gl: null, R: null, dirty: true,
  };
  p.gl = p.glc.getContext("webgl2", { antialias: false });
  p.R = makeRenderer(p.gl);
  bindCombo(p); bindNav(p);
  return p;
}

/* ---------------- WebGL ---------------- */
function sh(gl, type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
    throw gl.getShaderInfoLog(s);
  return s;
}
function prog(gl, vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl, gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS))
    throw gl.getProgramInfoLog(p);
  return p;
}
const VS = `#version 300 es
layout(location=0) in vec2 pos;
layout(location=1) in float sc;
uniform vec2 uS, uT; uniform float uPt; out float vSc;
void main(){ vSc=sc; gl_Position=vec4(pos*uS+uT,0.,1.); gl_PointSize=uPt; }`;
const FS_DOT = `#version 300 es
precision highp float;
uniform float uAdd, uFMin, uFMax, uFSign; in float vSc; out vec4 o;
void main(){ vec2 d=gl_PointCoord-.5; if(dot(d,d)>.25) discard;
  float c = vSc * uFSign;   // canonical B-vs-A score on both panels
  if (c < uFMin || c > uFMax) discard;
  o=vec4(uAdd, uAdd*vSc, 0., uAdd); }`;
const FS_HEAT = `#version 300 es
precision highp float; uniform sampler2D uD; uniform float uG, uInv, uMode;
in vec2 vUV; out vec4 o;
vec3 ramp(float t){
  const vec3 c0=vec3(.050,.063,.086), c1=vec3(.13,.22,.42),
    c2=vec3(.12,.49,.55), c3=vec3(.29,.76,.42), c4=vec3(.95,.90,.35),
    c5=vec3(1.,1.,.95);
  float x=t*5.; vec3 c=mix(c0,c1,clamp(x,0.,1.));
  c=mix(c,c2,clamp(x-1.,0.,1.)); c=mix(c,c3,clamp(x-2.,0.,1.));
  c=mix(c,c4,clamp(x-3.,0.,1.)); return mix(c,c5,clamp(x-4.,0.,1.)); }
vec3 divg(float t){  // t in [-1,1]: blue = compacted, orange = spread
  vec3 cold=vec3(.25,.55,1.), mid=vec3(.42,.45,.50), warm=vec3(1.,.55,.15);
  return t<0. ? mix(mid,cold,-t) : mix(mid,warm,t); }
void main(){ float d=texture(uD,vUV).r*uInv;
  float v=log(1.+d*exp(uG))/7.0; v=clamp(v,0.,1.);
  if(uMode<0.5){ o=vec4(ramp(v),1.); }
  else {
    float m=texture(uD,vUV).g/max(texture(uD,vUV).r,1e-9);
    o=vec4(divg(clamp(m,-1.,1.))*max(v,.04)*1.6, 1.); } }`;
const VS_Q = `#version 300 es
layout(location=0) in vec2 q; out vec2 vUV;
void main(){ vUV=q*.5+.5; gl_Position=vec4(q,0.,1.); }`;
const FS_SEL = `#version 300 es
precision highp float; uniform vec4 uC; out vec4 o;
void main(){ vec2 d=gl_PointCoord-.5; float r=dot(d,d);
  if(r>.25) discard; o=uC; }`;

function pickAccumFormat(gl) {
  // float accumulation preferred; fall back for software GL / mobile
  // two channels: r = density count, g = sum of per-point spread score
  if (gl.getExtension("EXT_color_buffer_float"))
    return { fmt: gl.RG32F, scale: 1.0, spread: true };
  if (gl.getExtension("EXT_color_buffer_half_float"))
    return { fmt: gl.RG16F, scale: 1.0, spread: true };
  return { fmt: gl.RGBA8, scale: 1 / 255, spread: false };  // density counts in .r * 255
}
function makeRenderer(gl) {
  const accum = pickAccumFormat(gl);
  const R = {
    accum,
    pDot: prog(gl, VS, FS_DOT), pHeat: prog(gl, VS_Q, FS_HEAT),
    pSel: prog(gl, VS, FS_SEL),
    vboPts: gl.createBuffer(), vboQuad: gl.createBuffer(),
    iboSel: gl.createBuffer(), nSel: 0, fb: null, tex: null, fw: 0, fh: 0,
    iboHover: gl.createBuffer(), nHover: 0,
    vaoPts: gl.createVertexArray(), vaoQuad: gl.createVertexArray(),
    vaoSel: gl.createVertexArray(), vaoHover: gl.createVertexArray(), n: 0,
  };
  gl.bindVertexArray(R.vaoQuad);
  gl.bindBuffer(gl.ARRAY_BUFFER, R.vboQuad);
  gl.bufferData(gl.ARRAY_BUFFER,
    new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);
  return R;
}
function setPoints(p, i16, n) {
  const { gl, R } = p;
  R.n = n;
  gl.bindBuffer(gl.ARRAY_BUFFER, R.vboPts);
  gl.bufferData(gl.ARRAY_BUFFER, i16, gl.STATIC_DRAW);
  for (const vao of [R.vaoPts, R.vaoSel, R.vaoHover]) {
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, R.vboPts);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.SHORT, true, 0, 0);
    if (vao === R.vaoSel)
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, R.iboSel);
    if (vao === R.vaoHover)
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, R.iboHover);
    gl.bindVertexArray(null);
  }
}
function setHover(p, ids) {
  const { gl, R } = p;
  R.nHover = ids ? ids.length : 0;
  if (R.nHover) {
    gl.bindVertexArray(R.vaoHover);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, R.iboHover);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ids, gl.DYNAMIC_DRAW);
    gl.bindVertexArray(null);
  }
  p.dirty = true;
}
function setScores(p, f32OrNull) {
  const { gl, R } = p;
  R.hasScores = !!f32OrNull;
  if (f32OrNull) {
    if (!R.vboScore) R.vboScore = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, R.vboScore);
    gl.bufferData(gl.ARRAY_BUFFER, f32OrNull, gl.DYNAMIC_DRAW);
    gl.bindVertexArray(R.vaoPts);
    gl.bindBuffer(gl.ARRAY_BUFFER, R.vboScore);
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 0, 0);
    gl.bindVertexArray(null);
  } else {
    gl.bindVertexArray(R.vaoPts);
    gl.disableVertexAttribArray(1);
    gl.vertexAttrib1f(1, 0);
    gl.bindVertexArray(null);
  }
  p.dirty = true;
}
function setSelection(p, ids) {
  const { gl, R } = p;
  R.nSel = ids ? ids.length : 0;
  if (R.nSel) {
    gl.bindVertexArray(R.vaoSel);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, R.iboSel);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, ids, gl.DYNAMIC_DRAW);
    gl.bindVertexArray(null);
  }
  p.dirty = true;
}
function draw(p) {
  const { gl, R } = p;
  const w = p.glc.clientWidth * devicePixelRatio | 0;
  const h = p.glc.clientHeight * devicePixelRatio | 0;
  if (!w || !h || !R.n) return;
  if (p.glc.width !== w || p.glc.height !== h) {
    p.glc.width = w; p.glc.height = h;
  }
  if (R.fw !== w || R.fh !== h) {
    if (R.tex) { gl.deleteTexture(R.tex); gl.deleteFramebuffer(R.fb); }
    R.tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, R.tex);
    gl.texStorage2D(gl.TEXTURE_2D, 1, R.accum.fmt, w, h);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    R.fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, R.fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
      gl.TEXTURE_2D, R.tex, 0);
    R.fw = w; R.fh = h;
  }
  const aspect = w / h, v = p.view;
  const S = [v.z / aspect, v.z], T = [v.tx, v.ty];
  const pt = Math.max(1.5, Math.min(7, v.z * 1.15)) * devicePixelRatio;
  // pass 1: density accumulation
  gl.bindFramebuffer(gl.FRAMEBUFFER, R.fb);
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
  gl.useProgram(R.pDot);
  gl.uniform2fv(gl.getUniformLocation(R.pDot, "uS"), S);
  gl.uniform2fv(gl.getUniformLocation(R.pDot, "uT"), T);
  gl.uniform1f(gl.getUniformLocation(R.pDot, "uPt"), pt);
  gl.uniform1f(gl.getUniformLocation(R.pDot, "uAdd"), R.accum.scale);
  const filterOn = state.view === "spread" && R.hasScores
    && (state.fmin > -3 || state.fmax < 3);
  gl.uniform1f(gl.getUniformLocation(R.pDot, "uFMin"),
    filterOn ? state.fmin / 3 : -9);
  gl.uniform1f(gl.getUniformLocation(R.pDot, "uFMax"),
    filterOn ? state.fmax / 3 : 9);
  gl.uniform1f(gl.getUniformLocation(R.pDot, "uFSign"), p.scoreSign || 1);
  gl.bindVertexArray(R.vaoPts);
  gl.drawArrays(gl.POINTS, 0, R.n);
  // pass 2: colormap to screen
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, w, h);
  gl.disable(gl.BLEND);
  gl.useProgram(R.pHeat);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, R.tex);
  gl.uniform1i(gl.getUniformLocation(R.pHeat, "uD"), 0);
  gl.uniform1f(gl.getUniformLocation(R.pHeat, "uG"),
    state.gain + Math.min(0.5 * Math.log(Math.max(1, v.z * v.z)), 3.0));
  gl.uniform1f(gl.getUniformLocation(R.pHeat, "uInv"),
    1.0 / R.accum.scale);
  gl.uniform1f(gl.getUniformLocation(R.pHeat, "uMode"),
    (state.view === "spread" && R.hasScores && R.accum.spread) ? 1 : 0);
  gl.bindVertexArray(R.vaoQuad);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  // pass 3: selected + hovered points
  const overlayPass = (vao, count, size, col) => {
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(R.pSel);
    gl.uniform2fv(gl.getUniformLocation(R.pSel, "uS"), S);
    gl.uniform2fv(gl.getUniformLocation(R.pSel, "uT"), T);
    gl.uniform1f(gl.getUniformLocation(R.pSel, "uPt"), size);
    gl.uniform4fv(gl.getUniformLocation(R.pSel, "uC"), col);
    gl.bindVertexArray(vao);
    gl.drawElements(gl.POINTS, count, gl.UNSIGNED_INT, 0);
  };
  const zBoost = Math.min(2.2, Math.max(1, Math.pow(v.z, 0.35)));
  if (R.nSel)
    overlayPass(R.vaoSel, R.nSel, Math.max(2.5, pt * 1.35),
      [1, .36, .23, Math.min(.85, .38 * zBoost)]);
  if (R.nHover)
    overlayPass(R.vaoHover, R.nHover, Math.max(2, pt * 1.2),
      [1, .85, .25, Math.min(.75, .30 * zBoost)]);
  gl.bindVertexArray(null);
}

/* ---------------- overlay: grid + tiles ---------------- */
function strokeShape(g, p, shape, style, lw) {
  g.strokeStyle = style; g.lineWidth = lw;
  if (shape.type === "rect") {
    const [a, b] = dataToScreen(p, shape.x0, shape.y0);
    const [x2, y2] = dataToScreen(p, shape.x1, shape.y1);
    g.strokeRect(Math.min(a, x2), Math.min(b, y2),
      Math.abs(x2 - a), Math.abs(y2 - b));
  } else {
    const [cx, cy] = dataToScreen(p, shape.cx, shape.cy);
    const [ex] = dataToScreen(p, shape.cx + shape.rx, shape.cy);
    g.beginPath();
    g.arc(cx, cy, Math.abs(ex - cx), 0, Math.PI * 2);
    g.stroke();
  }
}
function drawOverlay(p, hoverShape) {
  const c = p.ovc, w = c.clientWidth * devicePixelRatio | 0,
        h = c.clientHeight * devicePixelRatio | 0;
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d");
  g.clearRect(0, 0, w, h);
  if (hoverShape)
    strokeShape(g, p, hoverShape, "rgba(255,215,80,.9)",
      2 * devicePixelRatio);
  const sel = state.sel;
  if (sel.shape && sel.from === p.key)
    strokeShape(g, p, sel.shape, "rgba(255,93,58,.95)",
      2.5 * devicePixelRatio);
}
function screenToData(p, px, py) {
  const w = p.ovc.clientWidth, h = p.ovc.clientHeight, v = p.view;
  const aspect = w / h;
  const cx = (px / w) * 2 - 1, cy = 1 - (py / h) * 2;
  return [(cx - v.tx) / (v.z / aspect), (cy - v.ty) / v.z];
}
function dataToScreen(p, dx, dy) {
  const w = p.ovc.clientWidth, h = p.ovc.clientHeight, v = p.view;
  const aspect = w / h;
  const cx = dx * (v.z / aspect) + v.tx, cy = dy * v.z + v.ty;
  return [((cx + 1) / 2) * w * devicePixelRatio,
          ((1 - cy) / 2) * h * devicePixelRatio];
}

/* ---------------- navigation + tile click ---------------- */
function hoverShapeAt(p, e) {
  const r = p.ovc.getBoundingClientRect();
  const px = e.clientX - r.left, py = e.clientY - r.top;
  if (state.pick === "circle") {
    const [cx, cy] = screenToData(p, px, py);
    const [ex, ey] = screenToData(p, px + state.pickR, py + state.pickR);
    return { type: "circle", cx, cy, rx: Math.abs(ex - cx),
             ry: Math.abs(ey - cy) };
  }
  const tx = Math.floor(px / TILE) * TILE, ty = Math.floor(py / TILE) * TILE;
  const [x0, y0] = screenToData(p, tx, ty + TILE);
  const [x1, y1] = screenToData(p, tx + TILE, ty);
  return { type: "rect", x0, y0, x1, y1 };
}
function bindNav(p) {
  const el = p.ovc;
  let drag = null, moved = false, hoverScan = null;
  el.addEventListener("pointerdown", e => {
    drag = [e.clientX, e.clientY]; moved = false;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect();
    if (drag) {
      const dx = e.clientX - drag[0], dy = e.clientY - drag[1];
      if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
      if (moved) {
        p.view.tx += (dx / r.width) * 2;
        p.view.ty -= (dy / r.height) * 2;
        drag = [e.clientX, e.clientY]; p.dirty = true;
      }
    }
    const shape = hoverShapeAt(p, e);
    drawOverlay(p, shape);
    // live highlight on the other map, rAF-throttled
    if (!drag && p.coords) {
      if (!hoverScan) {
        hoverScan = requestAnimationFrame(() => {
          hoverScan = null;
          const other = p === A ? B : A;
          setHover(other, scanShape(p, shape));
        });
      }
    }
  });
  el.addEventListener("pointerleave", () => {
    drawOverlay(p, null);
    setHover(p === A ? B : A, null);
  });
  el.addEventListener("pointerup", e => {
    el.releasePointerCapture(e.pointerId);
    if (!moved && drag) pickClick(p, e);
    drag = null;
  });
  el.addEventListener("wheel", e => {
    e.preventDefault();
    const r = el.getBoundingClientRect();
    const [dx, dy] = screenToData(p, e.clientX - r.left, e.clientY - r.top);
    const f = Math.exp(-e.deltaY * 0.0016);
    const v = p.view, aspect = r.width / r.height;
    v.z *= f;
    v.tx = ((e.clientX - r.left) / r.width) * 2 - 1 - dx * (v.z / aspect);
    v.ty = 1 - ((e.clientY - r.top) / r.height) * 2 - dy * v.z;
    p.dirty = true;
  }, { passive: false });
  el.addEventListener("dblclick", () => {
    p.view = { z: 0.92, tx: 0, ty: 0 }; p.dirty = true;
    clearSelection();
  });
}
function pickClick(p, e) {
  if (!p.coords) return;
  const shape = hoverShapeAt(p, e);
  const ids = scanShape(p, shape);
  state.sel = { ids, from: p.key, shape };
  applySelection();
}
function scanShape(p, shape) {
  const q = p.coords, out = [];
  const filterOn = state.view === "spread" && p.scoresRaw
    && (state.fmin > -3 || state.fmax < 3);
  const sgn = p.scoreSign || 1, lo = state.fmin / 3, hi = state.fmax / 3;
  const keep = i => {
    if (filterOn) {
      const s = p.scoresRaw[i] * sgn;
      if (s < lo || s > hi) return false;
    }
    out.push(i);
    return true;
  };
  if (shape.type === "rect") {
    const a = Math.round(Math.max(-1, shape.x0) * 32767),
          b = Math.round(Math.max(-1, shape.y0) * 32767),
          c = Math.round(Math.min(1, shape.x1) * 32767),
          d = Math.round(Math.min(1, shape.y1) * 32767);
    for (let i = 0, n = p.n; i < n; i++) {
      const x = q[i << 1], y = q[(i << 1) | 1];
      if (x >= a && x <= c && y >= b && y <= d) keep(i);
    }
  } else {
    const cx = shape.cx * 32767, cy = shape.cy * 32767;
    const rx = Math.max(shape.rx * 32767, 1e-6),
          ry = Math.max(shape.ry * 32767, 1e-6);
    for (let i = 0, n = p.n; i < n; i++) {
      const dx = (q[i << 1] - cx) / rx, dy = (q[(i << 1) | 1] - cy) / ry;
      if (dx * dx + dy * dy <= 1) keep(i);
    }
  }
  return new Uint32Array(out);
}
function clearSelection() {
  state.sel = { ids: null, from: null, shape: null };
  setHover(A, null); setHover(B, null);
  applySelection();
}
function applySelection() {
  for (const p of [A, B]) {
    setSelection(p, state.sel.ids);
    drawOverlay(p, null);
  }
  renderTableReset();
}

/* ---------------- combobox ---------------- */
function comboEntries() {
  return catalog.maps.filter(e => e.rung === state.rung);
}
function bindCombo(p) {
  const show = (filter) => {
    const f = (filter || "").toLowerCase();
    const es = comboEntries().filter(e => e.arm.toLowerCase().includes(f));
    p.list.innerHTML = es.slice(0, 80).map((e, i) =>
      `<div data-arm="${e.arm}">
        <span class="ffr">${e.ffr != null ? e.ffr.toFixed(4) : "–"}</span>
        <span class="${e.upstream ? "up" : ""}">${e.arm}</span>
        <span class="dt">${e.date_et}</span></div>`).join("");
    p.list.style.display = es.length ? "block" : "none";
    for (const div of p.list.children)
      div.onmousedown = ev => { ev.preventDefault();
        selectMap(p, div.dataset.arm); p.list.style.display = "none"; };
  };
  p.input.addEventListener("focus", () => { p.input.select(); show(""); });
  p.input.addEventListener("input", () => show(p.input.value));
  p.input.addEventListener("blur",
    () => setTimeout(() => p.list.style.display = "none", 150));
}
async function selectMap(p, arm) {
  const e = comboEntries().find(x => x.arm === arm);
  if (!e) return;
  p.entry = e;
  p.input.value = e.arm;
  const o = e.overrides || {};
  const bits = [
    e.ffr != null ? `FFR <b>${e.ffr.toFixed(4)}</b>` : null,
    e.dose ? `dose ×${e.dose}` : null,
    o.rankneg_window ? `rankneg ${(o.rankneg_window / 1e3) | 0}K` : null,
    o.neg_tanh_gamma ? `tanh${o.neg_tanh_gamma}` : null,
    o.hidden_dim ? `h${o.hidden_dim}` : null,
    o.batch_size ? `bs${(o.batch_size / 1024) | 0}K` : null,
    `n ${(e.n / 1e6).toFixed(2)}M`, e.date_et,
  ].filter(Boolean);
  p.meta.innerHTML = bits.join(" · ");
  pushHash();
  const buf = await fetch(e.bin).then(r => r.arrayBuffer());
  p.coords = new Int16Array(buf);
  p.n = e.n;
  setPoints(p, p.coords, e.n);
  p.spread = null;
  try {
    const sb = await fetch(e.bin.replace(/\.bin$/, ".spread.bin"));
    if (sb.ok) p.spread = new Uint16Array(await sb.arrayBuffer());
  } catch {}
  computePairSpread();
  if (state.sel.ids) setSelection(p, state.sel.ids);
  p.dirty = true;
}

function computePairSpread() {
  const ok = A.spread && B.spread && A.entry && B.entry
    && A.entry.rung === B.entry.rung && A.n === B.n;
  const info = document.getElementById("spreadinfo");
  if (!ok) {
    setScores(A, null); setScores(B, null);
    info.textContent = state.view === "spread" ? "spread n/a for pair" : "";
    return;
  }
  const n = A.n, sB = new Float32Array(n), sA = new Float32Array(n);
  let nComp = 0, nSpread = 0;
  const samp = [];
  for (let i = 0; i < n; i++) {
    const qa = F16[A.spread[i]], qb = F16[B.spread[i]];
    let v = 0;
    if (qa > 1e-7 && qb > 1e-7 && isFinite(qa) && isFinite(qb))
      v = Math.log2(qb / qa);
    if (v <= -1) nComp++; else if (v >= 1) nSpread++;
    if ((i & 1023) === 0) samp.push(v);
    const c = Math.max(-1, Math.min(1, v / 3));
    sB[i] = c; sA[i] = -c;
  }
  samp.sort((x, y) => x - y);
  const med = samp[samp.length >> 1] || 0;
  A.scoreSign = -1; B.scoreSign = 1;
  A.scoresRaw = sA; B.scoresRaw = sB;
  setScores(A, sA); setScores(B, sB);
  updateCount();
  info.textContent = `B vs A: median ${med >= 0 ? "+" : ""}${
    med.toFixed(2)} oct · ${(100 * nComp / n).toFixed(1)}% compacted >2× · ${
    (100 * nSpread / n).toFixed(1)}% spread >2×`;
}

/* ---------------- virtualized table ---------------- */
const tbody = document.getElementById("tbody"),
      tspacer = document.getElementById("tspacer");
let rowH = 74, contentCache = new Map(), fetching = new Set();
function renderTableReset() {
  contentCache = new Map(); fetching = new Set();
  const ids = state.sel.ids;
  document.getElementById("selcount").textContent = ids ? ids.length : 0;
  document.getElementById("selwhere").textContent = ids
    ? `points from map ${state.sel.from} tile — shown on ${
        state.sel.from === "A" ? "B" : "A"}` : "no tile selected";
  tbody.scrollTop = 0;
  rowH = (A.entry && A.entry.content === "image") ? 90 : 74;
  tspacer.style.height = (ids ? ids.length * rowH : 0) + "px";
  renderTableWindow();
}
function renderTableWindow() {
  for (const el of [...tbody.children])
    if (el !== tspacer) el.remove();
  const ids = state.sel.ids;
  if (!ids || !ids.length) return;
  const top = tbody.scrollTop, vh = tbody.clientHeight;
  const i0 = Math.max(0, (top / rowH | 0) - 4),
        i1 = Math.min(ids.length, ((top + vh) / rowH | 0) + 5);
  const missing = [];
  for (let i = i0; i < i1; i++) {
    const id = ids[i];
    const row = document.createElement("div");
    row.className = "trow"; row.style.top = (i * rowH) + "px";
    row.style.height = rowH + "px";
    const c = contentCache.get(id);
    const isImg = A.entry && A.entry.content === "image";
    row.innerHTML = `<span class="idx">#${id}</span>` + (c
      ? (isImg && c.thumb
          ? `<img loading="lazy" src="${API}${c.thumb}"><span class="txt">${
              esc(c.text || "")}</span>`
          : `<span class="txt">${esc(c.text || "(empty)")}</span>`)
      : `<span class="txt" style="color:var(--dim)">…</span>`);
    tbody.appendChild(row);
    if (!c && !fetching.has(id)) missing.push(id);
  }
  if (missing.length) fetchContent(missing.slice(0, 100));
}
function esc(s) {
  return s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;",
    ">": "&gt;" }[c]));
}
async function fetchContent(ids) {
  ids.forEach(id => fetching.add(id));
  try {
    const r = await fetch(`${API}/content?rung=${state.rung}&ids=${
      ids.join(",")}`);
    if (!r.ok) throw 0;
    const j = await r.json();
    for (const it of j.items) contentCache.set(it.id, it);
  } catch {
    for (const id of ids)
      contentCache.set(id, { id, text: "(content service offline)" });
  }
  renderTableWindow();
}
tbody.addEventListener("scroll", renderTableWindow);
document.getElementById("clearsel").onclick = clearSelection;
document.getElementById("clearsel2").onclick = clearSelection;
document.getElementById("pick").onchange = e => {
  state.pick = e.target.value;
  document.getElementById("pickr").style.display =
    state.pick === "circle" ? "inline" : "none";
};
document.getElementById("pickr").oninput = e => {
  state.pickR = +e.target.value;
};

/* ---------------- top-level wiring ---------------- */
const A = makePanel("colA", "A"), B = makePanel("colB", "B");
document.getElementById("gain").oninput = e => {
  state.gain = +e.target.value; A.dirty = B.dirty = true;
};
document.getElementById("view").onchange = e => {
  state.view = e.target.value; computePairSpread();
  document.getElementById("legend").style.display =
    state.view === "spread" ? "inline-flex" : "none";
  A.dirty = B.dirty = true; pushHash();
};
state.fmin = -3; state.fmax = 3;
const BW = 210, BSCALE = d3.scaleLinear().domain([-3, 3]).range([0, BW]);
let countPending = false;
function updateCount() {
  const el = document.getElementById("fcount");
  if (!B.scoresRaw) { el.textContent = ""; return; }
  if (countPending) return;
  countPending = true;
  requestAnimationFrame(() => {
    countPending = false;
    const s = B.scoresRaw, lo = state.fmin / 3, hi = state.fmax / 3;
    let c = 0;
    for (let i = 0; i < s.length; i++)
      if (s[i] >= lo && s[i] <= hi) c++;
    el.textContent = `${c.toLocaleString()} pts`;
  });
}
function applyFilterRange(lo, hi) {
  state.fmin = lo; state.fmax = hi;
  document.getElementById("frange").textContent =
    (lo > -2.999 || hi < 2.999)
      ? `${lo.toFixed(1)} … ${hi.toFixed(1)} oct` : "all";
  updateCount();
  A.dirty = B.dirty = true;
}
{
  const svg = d3.select("#brushsvg");
  const grad = svg.append("defs").append("linearGradient").attr("id", "lg");
  for (const [o, c] of [[0, "#408cff"], [.5, "#6b7380"], [1, "#ff8c26"]])
    grad.append("stop").attr("offset", o).attr("stop-color", c);
  svg.append("rect").attr("x", 0).attr("y", 9).attr("width", BW)
    .attr("height", 8).attr("rx", 4).attr("fill", "url(#lg)");
  const brush = d3.brushX().extent([[0, 3], [BW, 23]])
    .on("brush end", ev => {
      if (!ev.selection) applyFilterRange(-3, 3);
      else applyFilterRange(BSCALE.invert(ev.selection[0]),
                            BSCALE.invert(ev.selection[1]));
    });
  const g = svg.append("g").call(brush);
  g.on("dblclick", () => g.call(brush.move, null));
}
document.getElementById("swap").onclick = () => {
  const ea = A.entry, eb = B.entry;
  if (ea && eb) { selectMap(A, eb.arm); selectMap(B, ea.arm); }
};
document.getElementById("rung").onchange = e => setRung(e.target.value);
function setRung(rung) {
  state.rung = rung;
  document.getElementById("rung").value = rung;
  state.sel = { ids: null, from: null, shape: null };
  const es = comboEntries();
  // A default: the plain 0.6dev baseline, not an ablation of it
  const up = es.find(e => e.arm.startsWith("upstream-06dev"))
    || es.find(e => e.upstream);
  const recent = es.find(e => !e.upstream);
  if (up) selectMap(A, up.arm); else if (recent) selectMap(A, recent.arm);
  if (recent) selectMap(B, recent.arm);
  applySelection();
}
function hashState() {
  const h = new URLSearchParams(location.hash.slice(1));
  return { rung: h.get("rung"), a: h.get("a"), b: h.get("b"),
           view: h.get("view") };
}
function pushHash() {
  const h = new URLSearchParams();
  if (state.rung) h.set("rung", state.rung);
  if (A.entry) h.set("a", A.entry.arm);
  if (B.entry) h.set("b", B.entry.arm);
  if (state.view !== "heat") h.set("view", state.view);
  history.replaceState(null, "", "#" + h.toString());
}

(async function init() {
  catalog = await fetch("data/catalog.json").then(r => r.json());
  const counts = {};
  for (const e of catalog.maps) counts[e.rung] = (counts[e.rung] || 0) + 1;
  // 2M focus: rungs ordered by most-recent map, ~2M first
  const seen = new Map();
  for (const e of catalog.maps)
    if (!seen.has(e.rung)) seen.set(e.rung, e);
  rungs = [...seen.values()].sort((a, b) =>
    (b.rung === "2m-knobs") - (a.rung === "2m-knobs")
    || (Math.abs(b.n - 2e6) < 3e5) - (Math.abs(a.n - 2e6) < 3e5)
    || b.ts - a.ts);
  const sel = document.getElementById("rung");
  sel.innerHTML = rungs.map(e =>
    `<option value="${e.rung}">${e.rung_label} — ${e.rung} (${
      counts[e.rung]})</option>`).join("");
  const hs = hashState();
  if (hs.view) {
    state.view = hs.view;
    document.getElementById("view").value = hs.view;
    document.getElementById("legend").style.display =
      hs.view === "spread" ? "inline-flex" : "none";
  }
  setRung(hs.rung && counts[hs.rung] ? hs.rung : "2m-knobs");
  if (hs.a) selectMap(A, hs.a);
  if (hs.b) selectMap(B, hs.b);
  (function loop() {
    for (const p of [A, B]) if (p.dirty) { p.dirty = false; draw(p); }
    requestAnimationFrame(loop);
  })();
  new ResizeObserver(() => { A.dirty = B.dirty = true; }).observe(
    document.getElementById("main"));
})();
</script>
